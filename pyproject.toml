[project]
name = "manim-meander-winding"
version = "0.1.0"
description = "Manim animations for seaweed algebra meander winding moves."
readme = "README.md"
authors = [
    { name = "Jeffrey Morris", email = "jeff@jeff-m.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
    "manim>=0.22.0",
    "seaweed-algebra>=0.0.7",
]
[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0.0",
]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I"]
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401", "F403"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
